<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المالك | Decorator</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .dashboard-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .dashboard-logo img {
            width: 50px;
            height: 50px;
            border-radius: 12px;
        }

        .dashboard-logo h1 {
            color: #00f2f5;
            font-size: 1.5rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-badge {
            background: linear-gradient(135deg, #00f2f5, #00E676);
            color: #1a1a2e;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        .dashboard-title {
            color: #1a1a2e;
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }

        .dashboard-title span {
            color: #00f2f5;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .stat-icon {
            width: 70px;
            height: 70px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .stat-icon.blue {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }

        .stat-icon.green {
            background: linear-gradient(135deg, #00f2f5, #00E676);
            color: #1a1a2e;
        }

        .stat-icon.orange {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .stat-icon.purple {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
        }

        .stat-info h3 {
            font-size: 2rem;
            color: #1a1a2e;
            margin-bottom: 5px;
        }

        .stat-info p {
            color: #666;
            font-size: 0.9rem;
        }

        .section-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-title {
            color: #1a1a2e;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #00f2f5;
        }

        .add-btn {
            background: linear-gradient(135deg, #00f2f5, #00E676);
            color: #1a1a2e;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 242, 245, 0.4);
        }

        .project-form {
            display: none;
        }

        .project-form.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00f2f5;
            box-shadow: 0 0 0 3px rgba(0, 242, 245, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #00f2f5, #00E676);
            color: #1a1a2e;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-weight: 600;
            flex: 1;
        }

        .cancel-btn {
            background: #e0e0e0;
            color: #333;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-weight: 600;
        }

        .projects-list {
            margin-top: 1rem;
        }

        .project-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: background 0.3s;
        }

        .project-item:hover {
            background: #f8f9fa;
        }

        .project-item:last-child {
            border-bottom: none;
        }

        .project-info h4 {
            color: #1a1a2e;
            margin-bottom: 5px;
        }

        .project-info p {
            color: #666;
            font-size: 0.9rem;
        }

        .project-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status-new {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-progress {
            background: #fef3c7;
            color: #d97706;
        }

        .status-completed {
            background: #dcfce7;
            color: #16a34a;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: #ddd;
        }

        /* Responsive for Mobile */
        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                gap: 15px;
                padding: 1rem;
            }
            
            .dashboard-logo h1 {
                font-size: 1.2rem;
            }
            
            .user-info {
                width: 100%;
                justify-content: center;
            }
            
            .dashboard-title {
                font-size: 1.4rem;
                text-align: center;
            }
            
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .stat-card {
                flex-direction: row;
                justify-content: flex-start;
            }
            
            .stat-icon {
                width: 50px;
                height: 50px;
            }
            
            .section-header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            
            .add-btn {
                width: 100%;
                justify-content: center;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .project-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .project-item > div:last-child {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>
    <header class="dashboard-header">
        <div class="dashboard-logo">
            <img src="logo.jpg" alt="Logo">
            <h1>Decorator</h1>
        </div>
        <div class="user-info">
            <span class="user-badge"><i class="fas fa-crown"></i> المالك</span>
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> تسجيل خروج
            </button>
        </div>
    </header>

    <div class="dashboard-container">
        <h2 class="dashboard-title">مرحباً بك في <span>لوحة التحكم</span></h2>

        <div class="dashboard-grid">
            <div class="stat-card">
                <div class="stat-icon blue">
                    <i class="fas fa-project-diagram"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalProjects">0</h3>
                    <p>إجمالي المشاريع</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-info">
                    <h3 id="completedProjects">0</h3>
                    <p>المشاريع المكتملة</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-info">
                    <h3 id="pendingProjects">0</h3>
                    <p>قيد التنفيذ</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalClients">0</h3>
                    <p>العملاء</p>
                </div>
            </div>
        </div>

        <div class="section-card">
            <div class="section-header">
                <h3 class="section-title">
                    <i class="fas fa-plus-circle"></i>
                    إضافة مشروع جديد
                </h3>
                <button class="add-btn" onclick="showProjectForm()">
                    <i class="fas fa-plus"></i>
                    إضافة مشروع
                </button>
            </div>

            <div class="project-form" id="projectForm">
                <form id="addProjectForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>اسم المشروع</label>
                            <input type="text" id="projectName" placeholder="أدخل اسم المشروع" required>
                        </div>
                        <div class="form-group">
                            <label>اسم العميل</label>
                            <input type="text" id="clientName" placeholder="أدخل اسم العميل" required>
                        </div>
                        <div class="form-group">
                            <label>رقم الهاتف</label>
                            <input type="tel" id="clientPhone" placeholder="01xxxxxxxxx">
                        </div>
                        <div class="form-group">
                            <label>نوع المشروع</label>
                            <select id="projectType">
                                <option value="تشطيب شقة">تشطيب شقة</option>
                                <option value="تركيب سيراميك">تركيب سيراميك</option>
                                <option value="تشطيب حمام">تشطيب حمام</option>
                                <option value="تشطيب مطبخ">تشطيب مطبخ</option>
                                <option value="تجديد شقة">تجديد شقة</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>حالة المشروع</label>
                            <select id="projectStatus">
                                <option value="جديد">جديد</option>
                                <option value="قيد التنفيذ">قيد التنفيذ</option>
                                <option value="مكتمل">مكتمل</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>الموقع</label>
                            <input type="text" id="projectLocation" placeholder="مثال: الفيوم - ميدان المنتزه">
                        </div>
                        <div class="form-group">
                            <label>صورة المشروع</label>
                            <input type="file" id="projectImage" accept="image/*">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>ملاحظات</label>
                        <textarea id="projectNotes" rows="3" placeholder="أي ملاحظات إضافية..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="submit-btn">
                            <i class="fas fa-save"></i> حفظ المشروع
                        </button>
                        <button type="button" class="cancel-btn" onclick="hideProjectForm()">
                            إلغاء
                        </button>
                    </div>
                </form>
            </div>

            <div class="projects-list" id="projectsList">
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>جاري تحميل المشاريع...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check if user is owner
        async function checkOwner() {
            const token = localStorage.getItem('authToken');
            if (!token) return window.location.href = 'login.html';

            try {
                const res = await fetch('/cms/auth', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (!data.owner) window.location.href = 'login.html';
            } catch (e) {
                window.location.href = 'login.html';
            }
        }

        // Load projects from Backend
        async function loadProjects() {
            const token = localStorage.getItem('authToken');
            try {
                const res = await fetch('/cms/projects', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                return await res.json();
            } catch (e) {
                console.error(e);
                return [];
            }
        }

        // Delete project
        async function deleteProject(projectId) {
            if (!confirm('هل أنت متأكد من حذف هذا المشروع؟')) return;
            
            const token = localStorage.getItem('authToken');
            try {
                const res = await fetch('/cms/projects/' + projectId, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.ok) {
                    alert('تم حذف المشروع بنجاح');
                    await updateStats();
                    await renderProjects();
                } else {
                    alert('حدث خطأ أثناء الحذف');
                }
            } catch (e) {
                alert('حدث خطأ في الاتصال');
            }
        }

        // Save project to Backend
        async function saveProject(formData) {
            const token = localStorage.getItem('authToken');

            // 1. Upload image if exists
            let imageUrl = null;
            const imageFile = document.getElementById('projectImage').files[0];
            if (imageFile) {
                const uploadData = new FormData();
                uploadData.append('image', imageFile);
                try {
                    const res = await fetch('/cms/upload', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token },
                        body: uploadData
                    });
                    const data = await res.json();
                    if (data.imageUrl) imageUrl = data.imageUrl;
                } catch (e) { console.error('Upload failed', e); }
            }

            // 2. Save project data
            const projectData = {
                name: formData.get('name'),
                clientName: formData.get('clientName'),
                clientPhone: formData.get('clientPhone'),
                type: formData.get('type'),
                status: formData.get('status'),
                location: formData.get('location'),
                notes: formData.get('notes'),
                imageUrl: imageUrl // Add uploaded image URL
            };

            try {
                await fetch('/cms/projects', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(projectData)
                });
                return true;
            } catch (e) {
                return false;
            }
        }

        // Update statistics
        async function updateStats() {
            const projects = await loadProjects();
            document.getElementById('totalProjects').textContent = projects.length;
            document.getElementById('completedProjects').textContent = projects.filter(p => p.status === 'مكتمل').length;
            document.getElementById('pendingProjects').textContent = projects.filter(p => p.status === 'قيد التنفيذ').length;
            const clients = new Set(projects.map(p => p.clientName));
            document.getElementById('totalClients').textContent = clients.size;
        }

        // Render projects list
        async function renderProjects() {
            const projects = await loadProjects();
            const container = document.getElementById('projectsList');

            if (!Array.isArray(projects) || projects.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <p>لا توجد مشاريع حالياً</p>
                    </div>
                `;
                return;
            }

            let html = '';
            // Backend returns sorted array, if not we can sort here
            projects.forEach(project => {
                let statusClass = 'status-new';
                if (project.status === 'قيد التنفيذ') statusClass = 'status-progress';
                if (project.status === 'مكتمل') statusClass = 'status-completed';

                html += `
                    <div class="project-item">
                        <div class="project-info">
                            <div style="display:flex; align-items:center; gap:10px;">
                                ${project.imageUrl ? `<img src="${project.imageUrl}" style="width:50px;height:50px;object-fit:cover;border-radius:5px;">` : ''}
                                <div>
                                    <h4>${project.name}</h4>
                                    <p>${project.clientName} - ${project.type}</p>
                                </div>
                            </div>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span class="project-status ${statusClass}">${project.status}</span>
                            <button onclick="deleteProject(${project.id})" style="background:#ef4444;color:white;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-family:Tajawal;font-size:0.85rem;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Show project form
        function showProjectForm() {
            document.getElementById('projectForm').classList.add('show');
        }

        // Hide project form
        function hideProjectForm() {
            document.getElementById('projectForm').classList.remove('show');
            document.getElementById('addProjectForm').reset();
        }

        // Add project form submission
        document.getElementById('addProjectForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = this.querySelector('.submit-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('name', document.getElementById('projectName').value);
            formData.append('clientName', document.getElementById('clientName').value);
            formData.append('clientPhone', document.getElementById('clientPhone').value);
            formData.append('type', document.getElementById('projectType').value);
            formData.append('status', document.getElementById('projectStatus').value);
            formData.append('location', document.getElementById('projectLocation').value);
            formData.append('notes', document.getElementById('projectNotes').value);

            await saveProject(formData);

            hideProjectForm();
            await updateStats();
            await renderProjects();

            btn.innerHTML = originalText;
            btn.disabled = false;
            alert('تم حفظ المشروع بنجاح!');
        });

        // Logout
        function logout() {
            localStorage.removeItem('authToken');
            sessionStorage.removeItem('userSession');
            window.location.href = 'login.html';
        }

        // Initialize
        checkOwner();
        updateStats();
        renderProjects();
    </script>
</body>

</html>
