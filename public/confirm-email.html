<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد البريد الإلكتروني | Decorator</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/validation.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <img src="logo.jpg" alt="Decorator Logo">
                <h2>تأكيد البريد الإلكتروني</h2>
                <p>Decorator – From Door To Full Decor</p>
            </div>
            
            <div id="alertContainer"></div>
            
            <div id="confirmationStatus" style="text-align: center; padding: 2rem;">
                <div id="loadingSpinner" class="loading-spinner" style="margin: 0 auto 2rem;"></div>
                <h3>جاري التحقق من رمز التأكيد...</h3>
                <p>يرجى الانتظار بينما يتم التحقق من بريدك الإلكتروني</p>
            </div>
            
            <div id="confirmationResult" style="display: none; text-align: center; padding: 2rem;">
                <!-- Result will be displayed here -->
            </div>
            
            <div style="margin-top: 2rem; text-align: center;">
                <a href="login.html" class="cta-button" style="display: inline-block; padding: 1rem 2rem; text-decoration: none;">
                    العودة لتسجيل الدخول
                </a>
            </div>
        </div>
    </div>

    <script src="js/validation.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            const token = urlParams.get('token');
            
            if (!email || !token) {
                showError('رابط التأكيد غير صحيح أو منتهي الصلاحية');
                return;
            }
            
            // Verify the token
            setTimeout(() => {
                const result = emailConfirmation.verifyToken(email, token);
                
                const loadingSection = document.getElementById('confirmationStatus');
                const resultSection = document.getElementById('confirmationResult');
                
                loadingSection.style.display = 'none';
                resultSection.style.display = 'block';
                
                if (result.valid) {
                    resultSection.innerHTML = `
                        <div style="color: #28a745;">
                            <div style="font-size: 4rem; margin-bottom: 1rem;">✓</div>
                            <h3 style="color: #28a745; margin-bottom: 1rem;">${result.message}</h3>
                            <p style="margin-bottom: 2rem;">بريدك الإلكتروني تم تأكيده بنجاح. يمكنك الآن تسجيل الدخول بحسابك.</p>
                            <div style="background: #d4edda; padding: 1rem; border-radius: 8px; margin: 1rem 0;">
                                <strong>البريد الإلكتروني:</strong> ${email}<br>
                                <strong>الحالة:</strong> <span style="color: #155724;">مؤكد ✓</span>
                            </div>
                            <button onclick="redirectToLogin()" class="login-button" style="margin-top: 1rem;">
                                تسجيل الدخول الآن
                            </button>
                        </div>
                    `;
                } else {
                    resultSection.innerHTML = `
                        <div style="color: #dc3545;">
                            <div style="font-size: 4rem; margin-bottom: 1rem;">✕</div>
                            <h3 style="color: #dc3545; margin-bottom: 1rem;">فشل التأكيد</h3>
                            <p style="margin-bottom: 2rem;">${result.message}</p>
                            <div style="background: #f8d7da; padding: 1rem; border-radius: 8px; margin: 1rem 0;">
                                <strong>أسباب الفشل المحتملة:</strong><br>
                                • رمز التأكيد غير صحيح<br>
                                • رمز التأكيد منتهي الصلاحية (24 ساعة)<br>
                                • البريد الإلكتروني لم يتم تسجيله
                            </div>
                            <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem;">
                                <button onclick="requestNewConfirmation('${email}')" class="login-button" style="background: #ffc107; color: #212529;">
                                    إعادة إرسال التأكيد
                                </button>
                                <button onclick="redirectToLogin()" class="login-button">
                                    العودة لتسجيل الدخول
                                </button>
                            </div>
                        </div>
                    `;
                }
            }, 2000);
        });
        
        function showError(message) {
            const container = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert alert-error';
            alertDiv.innerHTML = `
                <span style="color: #dc3545;">⚠</span>
                ${message}
            `;
            container.appendChild(alertDiv);
            
            // Hide loading spinner
            document.getElementById('confirmationStatus').style.display = 'none';
        }
        
        function redirectToLogin() {
            window.location.href = 'login.html';
        }
        
        function requestNewConfirmation(email) {
            const result = emailConfirmation.resendConfirmation(email);
            if (result.success) {
                showAlert('تم إعادة إرسال رسالة التأكيد', 'success');
            } else {
                showAlert('فشل إعادة الإرسال', 'error');
            }
        }
        
        function showAlert(message, type = 'info') {
            const container = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `
                <span>${type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ'}</span>
                ${message}
            `;
            container.innerHTML = '';
            container.appendChild(alertDiv);
        }
    </script>
</body>
</html>
