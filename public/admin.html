<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMS Admin - Decorator</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .card{ background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.05); margin-bottom: 12px; }
    .login-form{ display: grid; gap: 10px; }
    input{ width: 100%; padding: 10px; border:1px solid #ddd; border-radius:6px; }
    button{ padding: 10px 14px; border-radius:8px; background:#00f2f5; border: none; font-weight:700; }
  </style>
</head>
<body>
  <div class="admin-wrap" style="max-width:720px; margin: 40px auto; padding: 0 20px;">
    <div class="card">
      <h2 style="margin-bottom:8px;">تسجيل الدخول إلى لوحة التحكم</h2>
      <div id="loginAlert" class="alert" style="display:none;"></div>
      <form id="adminLogin" class="login-form" onsubmit="return false;">
        <input id="adminEmail" type="email" placeholder="ramadan.nady1985@gmail.com" value="ramadan.nady1985@gmail.com" />
        <input id="adminPassword" type="password" placeholder="01099797984" value="01099797984" />
        <label><input id="rememberOwner" type="checkbox"/> ت remember me</label>
        <button onclick="loginOwner()">دخول</button>
      </form>
    </div>
  </div>
  <script>
    const OWNER_EMAIL = 'ramadan.nady1985@gmail.com'.toLowerCase();
    const OWNER_PASSWORD = '01099797984';
    function loginOwner(){
      const email = document.getElementById('adminEmail').value.trim().toLowerCase();
      const password = document.getElementById('adminPassword').value;
      const remember = document.getElementById('rememberOwner').checked;
      if(email===OWNER_EMAIL && password===OWNER_PASSWORD){
        const token='owner-token';
        localStorage.setItem('cms_token', token);
        if(remember) localStorage.setItem('cms_persist','1');
        window.location.href = 'owner-dashboard.html';
      } else {
        const el=document.getElementById('loginAlert'); el.style.display='block'; el.textContent='بيانات الدخول غير صحيحة';
      }
    }
  </script>
  <footer></footer>
  <script src="/js/footerAddresses.js"></script>
  </body>
</html>
