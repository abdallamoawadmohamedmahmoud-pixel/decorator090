<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة المرور | Decorator</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .forgot-box {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }

        .forgot-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        .forgot-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00f2f5, #00E676);
        }

        .forgot-header img {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin-bottom: 0.8rem;
            box-shadow: 0 6px 20px rgba(0, 242, 245, 0.3);
        }

        .forgot-header h2 {
            color: #00f2f5;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .forgot-header p {
            color: #aaa;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .forgot-body {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .input-wrap input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        .input-wrap input:focus {
            border-color: #00f2f5;
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 242, 245, 0.15);
            outline: none;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00f2f5, #00E676);
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 242, 245, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
        }

        .back-link a {
            color: #00f2f5;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-weight: 500;
            text-align: center;
            display: none;
        }

        .alert.error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            display: block;
        }

        .alert.success {
            background: #dcfce7;
            color: #16a34a;
            border: 1px solid #bbf7d0;
            display: block;
        }

        .alert.info {
            background: #dbeafe;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            display: block;
        }

        .contact-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
            text-align: center;
        }

        .contact-info h4 {
            color: #1a1a2e;
            margin-bottom: 0.5rem;
        }

        .contact-info p {
            color: #666;
            font-size: 0.9rem;
        }

        .contact-info a {
            color: #00f2f5;
            text-decoration: none;
            font-weight: 600;
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #25D366;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            margin-top: 0.5rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .whatsapp-btn:hover {
            background: #128C7E;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .forgot-box {
                border-radius: 0;
                min-height: 100vh;
            }
        }
    </style>
</head>

<body>
    <div class="forgot-box">
        <div class="forgot-header">
            <img src="logo.jpg" alt="Logo">
            <h2>نسيت كلمة المرور؟</h2>
            <p>لا تقلق، يمكننا مساعدتك</p>
        </div>

        <div class="forgot-body">
            <div id="alertBox"></div>

            <form id="forgotForm">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <div class="input-wrap">
                        <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fas fa-paper-plane"></i>
                    إرسال رابط الاستعادة
                </button>
            </form>

            <div class="contact-info">
                <h4>تحتاج مساعدة؟</h4>
                <p>تواصل معنا عبر الواتساب</p>
                <a href="https://wa.me/01099797984?text=مرحباً، أود استعادة كلمة المرور" class="whatsapp-btn" target="_blank">
                    <i class="fab fa-whatsapp"></i>
                    01099797984
                </a>
            </div>

            <div class="back-link">
                <a href="login.html"><i class="fas fa-arrow-right"></i> العودة لتسجيل الدخول</a>
            </div>
        </div>
    </div>

    <script>
        function showAlert(msg, type) {
            document.getElementById('alertBox').innerHTML =
                '<div class="alert ' + type + '">' + msg + '</div>';
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                showAlert('يرجى إدخال البريد الإلكتروني', 'error');
                return;
            }
            
            if (!validateEmail(email)) {
                showAlert('يرجى إدخال بريد إلكتروني صحيح', 'error');
                return;
            }

            // عرض رسالة نجاح
            showAlert('تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني. يرجى التواصل معنا عبر الواتساب للمتابعة.', 'success');
            
            // تعطيل الزر لفترة
            const btn = document.querySelector('.submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
            
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال رابط الاستعادة';
            }, 3000);
        });
    </script>
</body>

</html>
