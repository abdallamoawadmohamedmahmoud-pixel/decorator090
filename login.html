<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Decorator</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 2rem;
            text-align: center;
            position: relative;
        }
        .login-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00f2f5, #00E676);
        }
        .login-header img {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin-bottom: 0.8rem;
            box-shadow: 0 6px 20px rgba(0, 242, 245, 0.3);
        }
        .login-header h2 { color: #00f2f5; font-size: 1.6rem; font-weight: 700; }
        .login-header p { color: #aaa; font-size: 0.85rem; }
        .login-body { padding: 2rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #333; font-weight: 500; font-size: 0.9rem; }
        .input-wrap { position: relative; }
        .input-wrap i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #999; }
        .input-wrap input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }
        .input-wrap input:focus { outline: none; border-color: #00f2f5; }
        .input-wrap input:focus + i { color: #00f2f5; }
        .toggle-pass { cursor: pointer; transition: color 0.3s; }
        .toggle-pass:hover { color: #00f2f5; }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }
        .remember-me { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #666; }
        .remember-me input { width: 16px; height: 16px; cursor: pointer; }
        .forgot-link { color: #00f2f5; text-decoration: none; }
        .forgot-link:hover { text-decoration: underline; }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 242, 245, 0.3); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-align: center;
        }
        .alert.success { background: #d1fae5; color: #047857; border: 1px solid #6ee7b7; }
        .alert.error { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .signup-link { text-align: center; margin-top: 1.5rem; color: #666; font-size: 0.9rem; }
        .signup-link a { color: #00f2f5; text-decoration: none; font-weight: 600; }
        .signup-link a:hover { text-decoration: underline; }
        .back-home { text-align: center; margin-top: 1rem; }
        .back-home a { color: #666; text-decoration: none; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 5px; }
        .back-home a:hover { color: #00f2f5; }
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #aaa;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }
        .divider::before { margin-left: 15px; }
        .divider::after { margin-right: 15px; }
        @media (max-width: 480px) {
            .login-box { border-radius: 0; min-height: 100vh; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-header">
            <img src="logo.jpg" alt="Logo">
            <h2>تسجيل الدخول</h2>
            <p>Decorator – من الباب للديكور الكامل</p>
        </div>
        <div class="login-body">
            <div id="alertBox"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <div class="input-wrap">
                        <input type="email" id="email" placeholder="example@email.com" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <div class="input-wrap">
                        <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                        <i class="fas fa-lock toggle-pass" onclick="togglePassword()"></i>
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span>تذكرني</span>
                    </label>
                </div>
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    تسجيل الدخول
                </button>
            </form>
            <div class="signup-link">
                ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a>
            </div>
            <div class="back-home">
                <a href="index.html"><i class="fas fa-home"></i> العودة للرئيسية</a>
            </div>
        </div>
    </div>

    <script>
        // ============================
        // بيانات المالك الثابتة
        // ============================
        const OWNER_EMAIL = 'ramadan.nady1985@gmail.com';
        const OWNER_PASSWORD = '01099797984';

        // ============================
        // دوال المساعدة
        // ============================
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.querySelector('.toggle-pass');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-lock', 'fa-lock-open');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-lock-open', 'fa-lock');
            }
        }

        function showAlert(msg, type) {
            document.getElementById('alertBox').innerHTML = '<div class="alert ' + type + '">' + msg + '</div>';
        }

        // ============================
        // تحميل البيانات المحفوظة
        // ============================
        window.onload = function() {
            const saved = localStorage.getItem('savedEmail');
            if (saved) {
                document.getElementById('email').value = saved;
                document.getElementById('remember').checked = true;
            }
        };

        // ============================
        // معالجة تسجيل الدخول
        // ============================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAlert('يرجى إدخال جميع البيانات', 'error');
                return;
            }

            const btn = document.querySelector('.login-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';
            btn.disabled = true;

            // التحقق من المالك
            if (email === OWNER_EMAIL && password === OWNER_PASSWORD) {
                const session = { email: email, isOwner: true, time: new Date().toISOString() };
                localStorage.setItem('userSession', JSON.stringify(session));
                localStorage.setItem('user', JSON.stringify({ email: email, role: 'owner' }));
                
                if (document.getElementById('remember').checked) {
                    localStorage.setItem('savedEmail', email);
                }

                showAlert('مرحباً يا مالك! جاري التحويل...', 'success');
                setTimeout(() => {
                    window.location.href = 'owner-dashboard.html';
                }, 1000);
                return;
            }

            // التحقق من المستخدمين العاديين
            const users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                const session = { email: email, isOwner: false, name: user.name, time: new Date().toISOString() };
                localStorage.setItem('userSession', JSON.stringify(session));
                localStorage.setItem('user', JSON.stringify({ 
                    id: user.id,
                    name: user.name, 
                    email: user.email, 
                    phone: user.phone,
                    avatar: user.avatar,
                    role: 'user'
                }));
                
                if (document.getElementById('remember').checked) {
                    localStorage.setItem('savedEmail', email);
                }

                showAlert('تم تسجيل الدخول بنجاح!', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
                return;
            }

            // فشل تسجيل الدخول
            showAlert('البريد الإلكتروني أو كلمة المرور غير صحيحة', 'error');
            btn.innerHTML = originalText;
            btn.disabled = false;
        });
    </script>
</body>
</html>
