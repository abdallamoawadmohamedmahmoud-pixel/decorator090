<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Decorator</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 2rem;
            text-align: center;
        }

        .login-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00f2f5, #00E676);
        }

        .login-header img {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin-bottom: 0.8rem;
            box-shadow: 0 6px 20px rgba(0, 242, 245, 0.3);
        }

        .login-header h2 {
            color: #00f2f5;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .login-header p {
            color: #aaa;
            font-size: 0.85rem;
        }

        .login-body {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .input-wrap input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        .input-wrap input:focus {
            border-color: #00f2f5;
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 242, 245, 0.15);
            outline: none;
        }

        .input-wrap input.error {
            border-color: #dc2626;
            background: #fef2f2;
        }

        .input-wrap input.success {
            border-color: #16a34a;
            background: #f0fdf4;
        }

        .toggle-pass {
            position: absolute;
            left: 15px;
            right: auto;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
        }

        .toggle-pass:hover {
            color: #00f2f5;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #555;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            accent-color: #00f2f5;
        }

        .forgot-link {
            color: #00f2f5;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00f2f5, #00E676);
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 242, 245, 0.4);
        }

        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
            color: #555;
        }

        .signup-link a {
            color: #00f2f5;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 1rem;
        }

        .back-home a {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-home a:hover {
            color: #00f2f5;
        }

        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-weight: 500;
            text-align: center;
            display: none;
        }

        .alert.error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            display: block;
        }

        .alert.success {
            background: #dcfce7;
            color: #16a34a;
            border: 1px solid #bbf7d0;
            display: block;
        }

        @media (max-width: 480px) {
            .login-box {
                border-radius: 0;
                min-height: 100vh;
            }
        }
    </style>
</head>

<body>
    <div class="login-box">
        <div class="login-header">
            <img src="logo.jpg" alt="Logo">
            <h2>تسجيل الدخول</h2>
            <p>Decorator – من الباب للديكور الكامل</p>
        </div>

        <div class="login-body">
            <div id="alertBox"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <div class="input-wrap">
                        <input type="email" id="email" placeholder="example@email.com">
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>كلمة المرور</label>
                    <div class="input-wrap">
                        <input type="password" id="password" placeholder="أدخل كلمة المرور">
                        <i class="fas fa-lock toggle-pass" onclick="togglePassword()"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span>تذكرني</span>
                    </label>
                    <a href="forgot-password.html" class="forgot-link">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    تسجيل الدخول
                </button>
            </form>

            <div class="signup-link">
                ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a>
            </div>

            <div class="back-home">
                <a href="index.html"><i class="fas fa-home"></i> العودة للرئيسية</a>
            </div>
        </div>
    </div>

    <script>
        // =======================
        // إعدادات المالك الثابتة
        // =======================
        const OWNER_EMAIL = 'ramadan.nady1985@gmail.com';
        const OWNER_PASSWORD = '01099797984';

        // =======================
        // دوال المساعدة
        // =======================
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.querySelector('.toggle-pass');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-lock', 'fa-lock-open');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-lock-open', 'fa-lock');
            }
        }

        function showAlert(msg, type) {
            document.getElementById('alertBox').innerHTML =
                '<div class="alert ' + type + '">' + msg + '</div>';
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function saveSession(email, isOwner) {
            const session = {
                email: email,
                isOwner: isOwner,
                time: new Date().toISOString()
            };
            sessionStorage.setItem('userSession', JSON.stringify(session));

            if (document.getElementById('remember').checked) {
                localStorage.setItem('savedEmail', email);
            } else {
                localStorage.removeItem('savedEmail');
            }
        }

        // =======================
        // تحميل البيانات المحفوظة
        // =======================
        window.onload = function () {
            const saved = localStorage.getItem('savedEmail');
            if (saved) {
                document.getElementById('email').value = saved;
                document.getElementById('remember').checked = true;
            }
        }

        // =======================
        // التحقق من البريد عند الكتابة
        // =======================
        document.getElementById('email').addEventListener('blur', function () {
            const email = this.value.trim();
            const input = this.parentElement;

            if (email && validateEmail(email)) {
                input.querySelector('input').classList.add('success');
                input.querySelector('input').classList.remove('error');
            } else if (email) {
                input.querySelector('input').classList.add('error');
                input.querySelector('input').classList.remove('success');
            }
        });

        document.getElementById('email').addEventListener('focus', function () {
            this.classList.remove('error', 'success');
        });

        // =======================
        // معالجة نموذج تسجيل الدخول
        // =======================
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAlert('يرجى إدخال جميع البيانات المطلوبة', 'error');
                return;
            }

            const submitBtn = document.querySelector('.login-btn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';
            submitBtn.disabled = true;

            // Owner's credentials
            const OWNER_EMAIL = 'ramadan.nady1985@gmail.com';
            const OWNER_PASSWORD = '01099797984';

            // Simple direct login check
            setTimeout(() => {
                if (email.toLowerCase() === OWNER_EMAIL.toLowerCase() && password === OWNER_PASSWORD) {
                    // Owner login
                    localStorage.setItem('cms_token', 'token-' + Date.now());
                    localStorage.setItem('cms_user', JSON.stringify({
                        email: OWNER_EMAIL,
                        name: 'المالك',
                        isOwner: true
                    }));
                    
                    showAlert('مرحباً يا مالك! جاري التحويل للوحة التحكم...', 'success');
                    setTimeout(() => {
                        window.location.href = 'owner_dashboard.html';
                    }, 1000);
                } else {
                    // Try to find user in localStorage
                    let users = [];
                    try {
                        users = JSON.parse(localStorage.getItem('decorator_users') || '[]');
                    } catch(e) {
                        users = [];
                    }
                    
                    const user = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);
                    
                    if (user) {
                        localStorage.setItem('cms_token', 'token-' + Date.now());
                        localStorage.setItem('cms_user', JSON.stringify({
                            email: user.email,
                            name: user.name,
                            isOwner: user.is_owner || false
                        }));
                        
                        showAlert('تم تسجيل دخولك بنجاح!', 'success');
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    } else {
                        showAlert('البريد الإلكتروني أو كلمة المرور غير صحيحة', 'error');
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                    }
                }
            }, 300);
        });
    </script>
</body>

</html>
